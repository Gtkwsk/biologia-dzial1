# Wdrożenie na Netlify z gałęzi main.
# Publikowany jest tylko katalog app/. Dokumenty projektu, testy i narzędzia
# zostają poza stroną.

[build]
  publish = "app"
  # Wdrożenie zatrzymuje się, jeśli testy albo walidator danych zgłoszą błąd.
  command = "node --test && node tools/validate-data.js"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Service worker zawsze sprawdzany na nowo, żeby aktualizacje docierały od razu.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Pliki krojów nie zmieniają się pod tą samą nazwą.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
